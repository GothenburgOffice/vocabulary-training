# Ready-built release: no source checkout or local Node installation required.
name: vocabulary-training
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: vocabulary
      POSTGRES_USER: vocabulary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabulary -d vocabulary"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    image: ${VOCABULARY_IMAGE:-ghcr.io/gothenburgoffice/vocabulary-training:latest}
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: postgresql://vocabulary:${POSTGRES_PASSWORD}@db:5432/vocabulary
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    image: ${VOCABULARY_IMAGE:-ghcr.io/gothenburgoffice/vocabulary-training:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3420}:3000"
    environment:
      DATABASE_URL: postgresql://vocabulary:${POSTGRES_PASSWORD}@db:5432/vocabulary
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3420}
      APP_ORIGIN_ALIASES: ${APP_ORIGIN_ALIASES:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      REQUESTY_API_KEY: ${REQUESTY_API_KEY:-}
      REQUESTY_MODEL: ${REQUESTY_MODEL:-novita/ling-3.1-flash}
      REQUESTY_SPEECH_MODEL: ${REQUESTY_SPEECH_MODEL:-deepinfra/XiaomiMiMo/MiMo-V2.5-tts}
      REQUESTY_SPEECH_VOICE: ${REQUESTY_SPEECH_VOICE:-Mia}
      REQUESTY_PLUS_API_KEY: ${REQUESTY_PLUS_API_KEY:-}
      REQUESTY_PLUS_MODEL: ${REQUESTY_PLUS_MODEL:-}
      REQUESTY_PLUS_SPEECH_MODEL: ${REQUESTY_PLUS_SPEECH_MODEL:-}
      REQUESTY_PLUS_SPEECH_VOICE: ${REQUESTY_PLUS_SPEECH_VOICE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  postgres_data:
