# Automated tests and local test instances only, on top of compose.yaml or
# compose.images.yaml (CI sets COMPOSE_FILE). The first start opens registration with a
# privacy contact that is clearly not a real operator, so the tests can register accounts.
# Never use it for a real site: there, registration starts closed and is opened at /admin.
services:
  migrate:
    environment:
      ALLOW_REGISTRATION: "true"
      PRIVACY_CONTROLLER_NAME: Automated test stack, not a real operator
      PRIVACY_CONTACT_EMAIL: test-privacy@example.test
  app:
    environment:
      # Google sign-in (#152) against tests/support/fake-google.mjs instead of Google. The app
      # honours it only while APP_ORIGIN is plain HTTP on a loopback address.
      TEST_GOOGLE_TOKEN_URL: http://fake-google:4500/token
    depends_on:
      fake-google:
        condition: service_started
  fake-google:
    # The same Node as the app image (tests/toolchain.test.ts checks they match).
    image: node:22.23.4-trixie-slim
    command: ["node", "/fake-google.mjs"]
    volumes:
      - ./tests/support/fake-google.mjs:/fake-google.mjs:ro
    restart: "no"
