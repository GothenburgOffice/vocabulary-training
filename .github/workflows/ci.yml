name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are superseded; every main run finishes so each merge gets an image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
      - run: npm install --global npm@12.2.1
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22.23.4-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-disposable-password
      APP_PORT: 3013
      APP_ORIGIN: http://127.0.0.1:3013
      # compose.test.yaml opens registration with a fake privacy contact, for the tests.
      COMPOSE_FILE: compose.yaml:compose.test.yaml
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-disposable-admin-password
      TEST_ADMIN_EMAIL: ci-admin@example.test
      TEST_ADMIN_PASSWORD: ci-only-disposable-admin-password
      # Lets the integration test write and clear AI settings: only on these throwaway stacks.
      TEST_WRITE_SITE_SETTINGS: "1"
      SETTINGS_ENCRYPTION_KEY: Y2ktb25seS1kaXNwb3NhYmxlLWVuY3J5cHRpb24ta2U=
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
      - run: npm install --global npm@12.2.1
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22.23.4-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Start container stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - run: npm run test:integration
      - run: npx tsx tests/restart.mts prepare
      - name: Check persistence across application restart
        run: |
          docker compose restart app
          node scripts/wait-health.mjs http://127.0.0.1:3013/api/health
          npx tsx tests/restart.mts verify
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - name: Browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Cleanup disposable CI database
        if: always()
        run: docker compose down -v
  publish:
    name: Test release image and publish to GHCR
    # The containers job already builds and tests the same production target from source, so
    # PRs skip this job: the image-only Compose files and the push are checked on main, before
    # anything is published.
    if: github.event_name != 'pull_request'
    needs: [unit, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-ghcr-${{ github.repository }}
      cancel-in-progress: false
    env:
      POSTGRES_PASSWORD: ci-only-disposable-image-test-password
      APP_PORT: 3013
      APP_ORIGIN: http://127.0.0.1:3013
      COMPOSE_FILE: compose.images.yaml:compose.test.yaml
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: ci-only-disposable-admin-password
      TEST_ADMIN_EMAIL: ci-admin@example.test
      TEST_ADMIN_PASSWORD: ci-only-disposable-admin-password
      # Lets the integration test write and clear AI settings: only on these throwaway stacks.
      TEST_WRITE_SITE_SETTINGS: "1"
      SETTINGS_ENCRYPTION_KEY: Y2ktb25seS1kaXNwb3NhYmxlLWVuY3J5cHRpb24ta2U=
      VOCABULARY_IMAGE: vocabulary-training:publish
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
      - run: npm install --global npm@12.2.1
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22.23.4-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build release candidate
        run: docker build --target production --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$VOCABULARY_IMAGE" .
      - name: Test image-only Compose deployment
        run: docker compose up -d --wait --wait-timeout 240
      - run: npm run test:integration
      - name: Verify release-image persistence
        run: |
          npx tsx tests/restart.mts prepare
          docker compose restart app
          node scripts/wait-health.mjs http://127.0.0.1:3013/api/health
          npx tsx tests/restart.mts verify
      - name: Sign in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        if: github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag "$VOCABULARY_IMAGE" "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker tag "$VOCABULARY_IMAGE" "$image:latest"
          docker push "$image:latest"
          echo "PUBLISHED_IMAGE=$image:sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          {
            echo '### Published image'
            echo "\`$image:sha-$GITHUB_SHA\`"
            echo 'This exact linux/amd64 image passed image-only deployment, HTTP/database and restart checks before publishing.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public anonymous pull
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! docker --config "$RUNNER_TEMP/anonymous-docker" pull "$PUBLISHED_IMAGE"; then
            echo "::error::The image was pushed but is not anonymously accessible. For the first publication, set the GHCR package visibility to public in GitHub package settings, then rerun this job."
            exit 1
          fi
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Cleanup disposable image-test database
        if: always()
        run: docker compose down -v
