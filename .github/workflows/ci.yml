name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start container stack
        env:
          POSTGRES_PASSWORD: ci-only-disposable-password
          APP_PORT: 3013
          APP_ORIGIN: http://127.0.0.1:3013
          ALLOW_REGISTRATION: "true"
        run: docker compose up --build -d --wait --wait-timeout 240
      - run: npm run test:integration
      - run: npx tsx tests/restart.mts prepare
      - name: Check persistence across application restart
        env:
          POSTGRES_PASSWORD: ci-only-disposable-password
          APP_PORT: 3013
          APP_ORIGIN: http://127.0.0.1:3013
          ALLOW_REGISTRATION: "true"
        run: |
          docker compose restart app
          node scripts/wait-health.mjs http://127.0.0.1:3013/api/health
          npx tsx tests/restart.mts verify
      - name: Container logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-only-disposable-password
        run: docker compose logs --tail=100
      - name: Cleanup disposable CI database
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-disposable-password
        run: docker compose down -v
  publish:
    name: Test and publish GHCR image
    needs: [unit, containers]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-ghcr-${{ github.repository }}
      cancel-in-progress: false
    env:
      POSTGRES_PASSWORD: ci-only-disposable-image-test-password
      APP_PORT: 3013
      APP_ORIGIN: http://127.0.0.1:3013
      ALLOW_REGISTRATION: "true"
      VOCABULARY_IMAGE: vocabulary-training:publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build release candidate
        run: docker build --target production --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$VOCABULARY_IMAGE" .
      - name: Test image-only Compose deployment
        run: docker compose -f compose.images.yaml up -d --wait --wait-timeout 240
      - run: npm run test:integration
      - name: Verify release-image persistence
        run: |
          npx tsx tests/restart.mts prepare
          docker compose -f compose.images.yaml restart app
          node scripts/wait-health.mjs http://127.0.0.1:3013/api/health
          npx tsx tests/restart.mts verify
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag "$VOCABULARY_IMAGE" "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker tag "$VOCABULARY_IMAGE" "$image:latest"
          docker push "$image:latest"
          echo "PUBLISHED_IMAGE=$image:sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          {
            echo '### Published image'
            echo "\`$image:sha-$GITHUB_SHA\`"
            echo 'This exact linux/amd64 image passed image-only deployment, HTTP/database and restart checks before publishing.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public anonymous pull
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! docker --config "$RUNNER_TEMP/anonymous-docker" pull "$PUBLISHED_IMAGE"; then
            echo "::error::The image was pushed but is not anonymously accessible. For the first publication, set the GHCR package visibility to public in GitHub package settings, then rerun this job."
            exit 1
          fi
      - name: Container logs on failure
        if: failure()
        run: docker compose -f compose.images.yaml logs --tail=100
      - name: Cleanup disposable image-test database
        if: always()
        run: docker compose -f compose.images.yaml down -v
