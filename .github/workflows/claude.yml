name: Claude
# Mention @claude in an issue, a PR comment or a review and Claude Code answers in the thread,
# and can push a branch for a change. It reads CLAUDE.md, so the project rules apply.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Only `opened`: on later issue events (assigned, edited) the actor is whoever acted, not the
  # author, so an outsider's issue text would pass the write-access check.
  issues:
    types: [opened]
permissions:
  contents: read
# No concurrency group: GitHub keeps only one pending run per group, so a third mention would
# cancel the second. A run for an issue gets its own timestamped branch, but runs for an open
# PR all work on the PR's branch, so wait for one to finish before mentioning @claude again
# on the same PR.
jobs:
  claude:
    # The repo is public: the action refuses anyone whose event it is without write access
    # before calling Claude. Review events run the PR's copy of this workflow, so they are
    # limited to branches in this repository (fork PRs get no secrets anyway); pushing such a
    # branch already needs write access.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The action exchanges the workflow's OIDC token for a Claude GitHub App token.
      id-token: write
      # Lets Claude read CI results on a PR.
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1.0.266
        with:
          # Set one of the two secrets: a subscription token from `claude setup-token`,
          # or an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
