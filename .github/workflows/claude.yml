name: Claude
# Mention @claude in an issue, a PR comment or a review and Claude Code answers in the thread,
# and can push a branch for a change. It reads CLAUDE.md, so the project rules apply.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  # Only `opened`: on later issue events (assigned, edited) the actor is whoever acted, not the
  # author, so an outsider's issue text would pass the write-access check.
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  # One run per issue or PR at a time, because runs on an open PR all push to its head branch
  # (issue runs get their own timestamped branch). `queue: max` keeps every further mention
  # pending instead of replacing the earlier pending one, which is the default. A pending
  # mention on a PR still fails if the earlier run pushes to it: the action only works on the
  # PR version the mention was written against. Its tracking comment then stays at "working"
  # and the run shows as failed under Actions; mention @claude again once the push has landed.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max
jobs:
  claude:
    # The repo is public: the action refuses anyone whose event it is without write access
    # before calling Claude. Bots are skipped here as well: the action's human-actor check
    # would refuse them too (`allowed_bots` is empty), but Copilot's reviews quote "@claude"
    # and would start a doomed run each time. Review events run the PR's copy of this
    # workflow, so they are limited to branches in this repository (fork PRs get no secrets
    # anyway); pushing such a branch already needs write access.
    if: |
      !endsWith(github.actor, '[bot]') && github.actor != 'Copilot' &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # The action exchanges the workflow's OIDC token for a Claude GitHub App token.
      id-token: write
      # Lets Claude read CI results on a PR.
      actions: read
    steps:
      - name: Refuse pull requests from forks
        # `issue_comment` fires for PR conversation comments too, and its payload doesn't say
        # where the PR's branch lives. Claude would check out and run that branch with this
        # job's secrets, so a fork PR is refused here; the review events check this in `if`.
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.issue.number }}" --jq '.head.repo.full_name')
          if [ "$head" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::@claude doesn't run on pull requests from forks (head: $head)."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1.0.266
        with:
          # Set one of the two secrets: a subscription token from `claude setup-token`,
          # or an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
