version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Stay on Node 22 for broad hosting compatibility.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 22 for broad hosting compatibility.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # PostgreSQL is declared in Compose, not in the Dockerfile.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: pgvector/pgvector
    # Tags look like 0.8.6-pg18-trixie: updates move the pgvector version and keep the pg18
    # suffix. A major PostgreSQL upgrade (pg19) needs pg_upgrade or dump/restore, so it is
    # done by hand.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
