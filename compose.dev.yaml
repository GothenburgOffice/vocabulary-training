services:
  app:
    build:
      target: development
    # No NODE_ENV here: `next dev` and `next build` each set their own, and a container-wide
    # development value breaks `npm run build`.
    environment:
      # File events don't cross into the container from a Windows drive, so `next dev` polls
      # for changes. That needs webpack (`npm run dev` uses --webpack): Turbopack ignores this
      # and its own polling misses these edits. Set WATCHPACK_POLLING=false in .env on Linux
      # or macOS to save CPU.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_build:/app/.next
  migrate:
    environment:
      # The dev database always starts with registration open and a privacy contact that is
      # clearly not a real operator, so accounts can be created and the integration tests
      # run. Only seeded on its first start; change them later in Admin -> Registration.
      ALLOW_REGISTRATION: "true"
      PRIVACY_CONTROLLER_NAME: Local development, not a real operator
      PRIVACY_CONTACT_EMAIL: dev-privacy@example.test
volumes:
  node_modules:
  next_build:
