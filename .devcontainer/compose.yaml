# Dev container additions to compose.yaml + compose.dev.yaml.
services:
  app:
    # Reinstall dependencies only when the lockfile changed, before the dev server starts,
    # so the shared node_modules volume never goes stale and npm never races `next dev`.
    command:
      - sh
      - -c
      - >-
        cmp -s package-lock.json node_modules/.installed-lock ||
        (npm ci && cp package-lock.json node_modules/.installed-lock);
        exec npm run dev
    environment:
      # Local development only: the integration tests register throwaway accounts.
      ALLOW_REGISTRATION: "true"
      # Opening the app via 127.0.0.1 instead of localhost also works here.
      APP_ORIGIN_ALIASES: ${APP_ORIGIN_ALIASES:-http://127.0.0.1:${APP_PORT:-3420}}
      TEST_BASE_URL: http://localhost:3000
      TEST_ORIGIN: ${APP_ORIGIN:-http://localhost:3420}
      # Keyless by default so tests never call Requesty (they expect AI to be disabled).
      # Set DEV_REQUESTY_API_KEY / DEV_REQUESTY_PLUS_API_KEY in .env to try AI here;
      # the integration tests then fail.
      REQUESTY_API_KEY: ${DEV_REQUESTY_API_KEY:-}
      REQUESTY_PLUS_API_KEY: ${DEV_REQUESTY_PLUS_API_KEY:-}
      # Claude Code keeps its sign-in and settings in this volume across rebuilds.
      CLAUDE_CONFIG_DIR: /root/.claude
    volumes:
      - claude-config:/root/.claude
      # Claude Code's project memory lives outside the repo, so `git clean` or a fresh
      # clone never removes it. /app maps to the "-app" project folder.
      - ${CLAUDE_MEMORY_DIR:-${HOME:-${USERPROFILE}}/.claude-memory/vocabulary-training}:/root/.claude/projects/-app/memory

volumes:
  claude-config:
